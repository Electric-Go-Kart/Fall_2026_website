name: Static site CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start local web server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/website-server.log 2>&1 &
          echo $! > /tmp/website-server.pid

      - name: Verify home page is served
        run: curl --fail --retry 5 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/index.html

      - name: Stop local web server
        if: always()
        run: kill "$(cat /tmp/website-server.pid)" 2>/dev/null || true
